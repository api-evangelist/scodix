aid: scodix
name: Scodix
description: >-
  Scodix is a digital print enhancement (embellishment) technology company founded in 2007 and
  headquartered in Rosh HaAyin, Israel. It manufactures the Scodix Ultra series of digital
  embellishment presses and the Scodix Studio web-to-print software, enabling decorative effects
  across 17 applications including Spot UV, foil, glitter, metallic, cast-and-cure, braille and
  variable data. Scodix serves commercial print, folding-carton packaging, publishing and
  web-to-print markets with over 400 installations worldwide, and went public on the Tel Aviv
  Stock Exchange (TASE) in 2021. Scodix Studio exposes integration APIs for connecting embellishment
  workflows to MIS and web-to-print storefronts, but Scodix does not publish a public developer
  portal, OpenAPI definition, or self-serve API documentation.
